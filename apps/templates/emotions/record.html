<!DOCTYPE html>
<html>
<head>
    <title>Detección de Emociones</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .video-container { text-align: center; margin: 20px 0; }
        .controls { margin: 20px 0; }
        .btn { padding: 10px 20px; margin: 5px; cursor: pointer; border: none; }
        .btn-start { background-color: #4CAF50; color: white; }
        .btn-stop { background-color: #f44336; color: white; }
        .btn-download { background-color: #2196F3; color: white; }
        .status { margin: 10px 0; padding: 10px; background-color: #f0f0f0; }
        .emotion-display { font-size: 24px; font-weight: bold; margin: 10px 0; }
        .error { color: red; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Detección de Emociones en Tiempo Real</h1>
        
        <div class="video-container">
            <img id="video-feed" src="" alt="Video Feed" style="max-width: 100%; height: auto; display: none;">
        </div>
        
        <div class="controls">
            <button id="start-btn" class="btn btn-start">Iniciar Detección</button>
            <button id="stop-btn" class="btn btn-stop">Detener Detección</button>
            <button id="download-btn" class="btn btn-download">Descargar Registros</button>
        </div>
        
        <div class="status">
            <div>Estado: <span id="status">Detenido</span></div>
            <div class="emotion-display">Emoción: <span id="current-emotion">No detectado</span></div>
        </div>
        
        <div id="error-message" class="error" style="display: none;"></div>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const downloadBtn = document.getElementById('download-btn');
        const statusSpan = document.getElementById('status');
        const emotionSpan = document.getElementById('current-emotion');
        const videoFeed = document.getElementById('video-feed');
        const errorMessage = document.getElementById('error-message');

        let isRunning = false;
        let emotionInterval;

        // Obtener el prefijo de idioma actual
        const currentPath = window.location.pathname;
        const langPrefix = currentPath.split('/')[1] === 'es' ? '/es' : '';

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            console.error(message);
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        startBtn.addEventListener('click', async () => {
            hideError();
            console.log('Intentando iniciar...');
            
            try {
                const response = await fetch(langPrefix + '/emotions/start/', { 
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                console.log('Response status:', response.status);
                
                const contentType = response.headers.get('content-type');
                console.log('Content-Type:', contentType);
                
                if (!contentType || !contentType.includes('application/json')) {
                    const text = await response.text();
                    console.log('Response text:', text);
                    showError('Error: La respuesta no es JSON. Verifica la consola para más detalles.');
                    return;
                }
                
                const data = await response.json();
                console.log('Response data:', data);
                
                if (data.status === 'started') {
                    isRunning = true;
                    statusSpan.textContent = 'Grabando';
                    videoFeed.src = langPrefix + '/emotions/video_feed/';
                    videoFeed.style.display = 'block';
                    startEmotionUpdates();
                } else {
                    showError('Error: ' + data.status);
                }
            } catch (error) {
                console.error('Error completo:', error);
                showError('Error al iniciar: ' + error.message);
            }
        });

        stopBtn.addEventListener('click', async () => {
            hideError();
            
            try {
                const response = await fetch(langPrefix + '/emotions/stop/', { 
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                
                const data = await response.json();
                
                if (data.status === 'stopped') {
                    isRunning = false;
                    statusSpan.textContent = 'Detenido';
                    videoFeed.src = '';
                    videoFeed.style.display = 'none';
                    stopEmotionUpdates();
                } else {
                    showError('Error: ' + data.status);
                }
            } catch (error) {
                showError('Error al detener: ' + error.message);
            }
        });

        downloadBtn.addEventListener('click', () => {
            window.location.href = langPrefix + '/emotions/download/';
        });

        function startEmotionUpdates() {
            emotionInterval = setInterval(async () => {
                try {
                    const response = await fetch(langPrefix + '/emotions/current/');
                    const data = await response.json();
                    emotionSpan.textContent = data.emotion;
                } catch (error) {
                    console.error('Error al obtener emoción:', error);
                }
            }, 1000);
        }

        function stopEmotionUpdates() {
            if (emotionInterval) {
                clearInterval(emotionInterval);
                emotionInterval = null;
            }
        }
    </script>
</body>
</html>
